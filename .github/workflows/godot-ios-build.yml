name: Build OneState iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-ios-build.yml"

permissions:
  contents: read

concurrency:
  group: onestate-ios-ipa
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip" -o "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR/app"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$GODOT_DIR/templates.tpz"
          unzip -q "$GODOT_DIR/templates.tpz" -d "$GODOT_DIR/templates"
          test -d "$GODOT_DIR/templates/templates"
          cp -R "$GODOT_DIR/templates/templates/." "$TEMPLATE_DIR/"
          GODOT_BIN="$(find "$GODOT_DIR/app" -type f -path '*/Contents/MacOS/Godot' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
          "$GODOT_BIN" --version | grep -Eq "^4\.4\.1\.stable\.official\."

      - name: Fetch pinned realistic 3D assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/assets/models
          curl -fL --retry 4 --retry-delay 2 "https://tevy.dev/models/suv/v1/lod0.glb" -o godot/assets/models/realistic_suv.glb
          curl -fL --retry 4 --retry-delay 2 "https://raw.githubusercontent.com/memoriesrohit/avatar-studio/2fd9ec82fbe1613d40ae38aadcca3f410725f740/models/andre_casual.glb" -o godot/assets/models/realistic_character.glb
          test "$(wc -c < godot/assets/models/realistic_suv.glb)" -gt 500000
          test "$(wc -c < godot/assets/models/realistic_character.glb)" -gt 10000000
          file godot/assets/models/realistic_suv.glb godot/assets/models/realistic_character.glb

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path godot --import
          "$GODOT_BIN" --headless --path godot --editor --quit

      - name: Run main-scene startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/godot-scene-smoke.log"
          set +e
          "$GODOT_BIN" --headless --path godot --quit-after 5 --verbose 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot scene smoke test exited with status $GODOT_STATUS"
            exit "$GODOT_STATUS"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" "$LOG"; then
            echo "Godot reported runtime or resource errors during scene startup."
            exit 1
          fi

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT_BIN" --headless --verbose --path godot --export-debug "iOS" ../build/ios/OneStateLitee.xcodeproj
          PROJECT="$(find build/ios -maxdepth 3 -name '*.xcodeproj' -type d -print -quit)"
          test -n "$PROJECT"
          echo "IOS_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Exported Xcode project: $PROJECT"

      - name: Build unsigned arm64 iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$IOS_PROJECT" -list
          xcodebuild -project "$IOS_PROJECT" \
            -scheme OneStateLitee \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build
          APP_PATH="$(find build/derived/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist"
          test -f "$APP_PATH/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package and verify IPA structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" "build/ipa/Payload/$(basename "$APP_PATH")"
          cd build/ipa
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/OneState-Litee-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          test -s OneState-Litee-unsigned.ipa
          unzip -t OneState-Litee-unsigned.ipa
          unzip -Z1 OneState-Litee-unsigned.ipa | grep -E '^Payload/[^/]+\.app/Info\.plist$'
          unzip -Z1 OneState-Litee-unsigned.ipa | grep -E '^Payload/[^/]+\.app/[^/]+$' | head -n 1
          shasum -a 256 OneState-Litee-unsigned.ipa

      - name: Upload verified unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OneState-Litee-unsigned-IPA
          path: OneState-Litee-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
