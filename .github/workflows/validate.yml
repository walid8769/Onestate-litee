name: Validate OneState Lite
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker and browser modules
        run: |
          node --check worker/index.js
          node --check src/main.js
          node --check src/network.js
          node --check src/world.js
          node --check src/architecture.js
          node --check src/avatar.js
          npm test
      - name: Validate Wrangler configuration and Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
