name = "onestate-lite-realtime"
main = "worker/index.js"
compatibility_date = "2026-11-22"
workers_dev = true

[durable_objects]
bindings = [
  { name = "GAME_ROOMS", class_name = "GameRoom" },
  { name = "ACCOUNT_STORE", class_name = "AccountStore" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = true

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountStore"]
